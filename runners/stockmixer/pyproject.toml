[project]
name = "astraquant-stockmixer-runner"
version = "0.1.0"
description = "Dynamic-universe StockMixer runner for AstraQuant"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2,<3",
  "pyarrow>=18,<20",
  "torch>=2.7,<2.8",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = ["pytest>=9.0,<10"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astraquant_stockmixer_runner"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
